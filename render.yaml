# Blueprint Render : deux services web (un par dossier) et un Key Value pour les quotas.
# Render › New › Blueprint › ce dépôt. À la création, Render demande API_URL :
# saisir l'URL publique du service API (ex. https://immo-loiret-api.onrender.com).
services:
  - type: web
    name: immo-loiret-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn immo_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Assistant (Gemini) : clé à saisir dans le tableau de bord Render, jamais dans le dépôt
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_QUOTA_HEURE
        value: "300"
      # Quota par visiteur (20 demandes / 24 h), compté côté serveur dans le Key Value
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: immo-loiret-quota
          property: connectionString
      - key: QUOTA_PAR_VISITEUR
        value: "20"
      - key: QUOTA_FENETRE_HEURES
        value: "24"
      # Secrets générés par Render (jamais dans le dépôt) :
      # jeton partagé avec le tableau de bord, clé d'empreinte des IP
      - key: ASSISTANT_TOKEN
        generateValue: true
      - key: QUOTA_SEL
        generateValue: true

  - type: web
    name: immo-loiret-web
    runtime: python
    plan: free
    rootDir: frontend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # 8 threads par worker : les requêtes qui attendent l'API ou Gemini ne bloquent plus
    # le contrôle de santé de Render (sinon redémarrage « health check timed out »)
    startCommand: .venv/bin/gunicorn app:server --workers 2 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: API_URL
        sync: false
      - key: API_TIMEOUT
        value: "60"
      - key: DASH_DEBUG
        value: "0"
      # Même jeton que l'API, copié par Render : seul ce service peut appeler l'assistant
      - key: ASSISTANT_TOKEN
        fromService:
          type: web
          name: immo-loiret-api
          envVarKey: ASSISTANT_TOKEN

  # Compteurs de demandes à l'assistant (offre gratuite : en mémoire, sans disque ;
  # un redémarrage du Key Value remet les compteurs à zéro). Aucun accès public.
  - type: keyvalue
    name: immo-loiret-quota
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
