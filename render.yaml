# Blueprint Render : deux services web, un par dossier.
# Render › New › Blueprint › ce dépôt. À la création, Render demande API_URL :
# saisir l'URL publique du service API (ex. https://immo-loiret-api.onrender.com).
services:
  - type: web
    name: immo-loiret-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn immo_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Assistant (Gemini) : clé à saisir dans le tableau de bord Render, jamais dans le dépôt
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_QUOTA_HEURE
        value: "300"

  - type: web
    name: immo-loiret-web
    runtime: python
    plan: free
    rootDir: frontend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/gunicorn app:server --workers 2 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: API_URL
        sync: false
      - key: API_TIMEOUT
        value: "60"
      - key: DASH_DEBUG
        value: "0"
