[project]
name = "immo-loiret-api"
version = "1.0.0"
description = "API des prix médians de l'immobilier dans le Loiret (DVF 2021-2025)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "google-genai>=1.0",
    "mcp>=2.3,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
